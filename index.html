<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LaTeX & Markdown Viewer for Word</title>

<!-- PWA META TAGY -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#18181b">
<link rel="apple-touch-icon" href="icon-192.png">

<!-- KaTeX -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>

<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">

<style>
:root {
  /* graphite ramp */
  --bg: #111113;
  --surface: #18181b;
  --raised: #202024;
  --line: rgba(232, 230, 224, 0.08);
  --line-hi: rgba(232, 230, 224, 0.14);
  --text: #e8e6e0;
  --text-2: #a3a1a9;
  --text-3: #7c7a83;

  /* one accent: ink blue */
  --accent: #8fb0ff;

  /* semantic, toned down */
  --ok: #7fbf8e;
  --wait: #d6b46a;
  --err: #e08a80;

  /* paper */
  --paper: #fbfaf7;
  --paper-ink: #1d1d1f;
  --paper-ink-2: #5b5a60;
  --paper-line: rgba(29, 29, 31, 0.1);
  --paper-accent: #2f56c4;

  --mono: 'JetBrains Mono', ui-monospace, monospace;
  --sans: 'DM Sans', system-ui, sans-serif;

  --ease: cubic-bezier(0.2, 0, 0, 1);
  --fast: 120ms;
  --slow: 200ms;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  background: var(--bg); color: var(--text); font-family: var(--sans);
  display: flex; flex-direction: column; height: 100dvh;
  -webkit-font-smoothing: antialiased;
}
::selection { background: rgba(143, 176, 255, 0.28); }

/* ---------- top bar ---------- */
.topbar {
  height: 56px; flex-shrink: 0; display: flex; align-items: center; gap: 8px;
  padding: 0 16px 0 24px; background: var(--surface); border-bottom: 1px solid var(--line);
}
.logo { font-size: 15px; font-weight: 500; color: var(--text); letter-spacing: 0; }
.topbar-spacer { flex: 1; }
.btn {
  height: 32px; padding: 0 12px; display: inline-flex; align-items: center; gap: 8px;
  font-family: var(--sans); font-size: 13px; font-weight: 500;
  border: 1px solid transparent; border-radius: 8px; background: transparent; color: var(--text-2);
  cursor: pointer;
  transition: background-color var(--fast) var(--ease), color var(--fast) var(--ease), transform var(--fast) var(--ease);
}
.btn svg { width: 16px; height: 16px; stroke-width: 1.5; flex-shrink: 0; }
.btn:hover { background: var(--raised); color: var(--text); }
.btn:active { transform: scale(0.98); }
.btn.primary { background: var(--text); color: #141416; }
.btn.primary:hover { background: #ffffff; }
.btn:focus-visible, .divider:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- workspace ---------- */
.workspace { flex: 1; display: flex; overflow: hidden; min-height: 0; }
.pane { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.pane-header {
  height: 40px; flex-shrink: 0; display: flex; align-items: center; gap: 8px;
  padding: 0 24px; border-bottom: 1px solid var(--line);
}
#paneLeft .pane-header { background: var(--bg); }
#paneRight .pane-header { background: var(--surface); }
.pane-label { font-size: 13px; font-weight: 500; color: var(--text-2); }
.pane-meta { margin-left: auto; display: flex; align-items: center; gap: 4px; }
kbd {
  height: 20px; min-width: 20px; padding: 0 6px; display: inline-flex; align-items: center; justify-content: center;
  font-family: var(--mono); font-size: 11px; color: var(--text-3);
  background: var(--raised); border: 1px solid var(--line); border-bottom-color: var(--line-hi); border-radius: 4px;
}

/* render state dot (signature) */
.state-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-3); transition: background-color var(--slow) var(--ease); }
[data-state="pending"] .state-dot, .state-dot[data-state="pending"] { background: var(--wait); }
[data-state="ok"] .state-dot, .state-dot[data-state="ok"] { background: var(--ok); }
[data-state="error"] .state-dot, .state-dot[data-state="error"] { background: var(--err); }

/* ---------- input ---------- */
.input-area {
  flex: 1; overflow-y: auto; padding: 24px; background: var(--bg);
  font-family: var(--sans); font-size: 15px; line-height: 1.75; color: var(--text);
  white-space: pre-wrap; outline: none;
}
.input-area:empty:before { content: attr(data-placeholder); color: var(--text-3); pointer-events: none; }
.input-area h1 { font-size: 22px; font-weight: 600; margin: 0 0 16px; }
.input-area h2 { font-size: 18px; font-weight: 500; margin: 24px 0 8px; }
.input-area p { margin-bottom: 12px; }
.input-area ul, .input-area ol { margin: 0 0 12px 24px; padding-left: 16px; }

/* ---------- preview: paper ---------- */
.preview { flex: 1; overflow-y: auto; background: var(--surface); padding: 32px; }
.output-area {
  max-width: 760px; min-height: 100%; margin: 0 auto; padding: 56px 64px;
  background: var(--paper); color: var(--paper-ink); border-radius: 4px;
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.25);
  font-family: var(--sans); font-size: 15px; line-height: 1.75; white-space: pre-wrap;
}
/* pasted text often carries the chat's dark-theme colors; keep the page readable */
.output-area *:not(.katex *) { color: inherit !important; background-color: transparent !important; }
.output-area .katex { color: var(--paper-ink); font-size: 1.1em; }
.output-area .katex-display { margin: 20px 0; padding: 4px 0; overflow-x: auto; overflow-y: hidden; white-space: normal; }
.output-area .katex-error { color: #b4382c !important; border-bottom: 1px dashed currentColor; }
.output-area h1 { font-size: 24px; font-weight: 600; line-height: 1.3; margin: 0 0 20px; }
.output-area h2 { font-size: 19px; font-weight: 600; line-height: 1.35; margin: 32px 0 12px; }
.output-area h3 { font-size: 16px; font-weight: 600; margin: 24px 0 8px; }
.output-area p { margin-bottom: 12px; }
.input-area > :first-child, .output-area > :first-child { margin-top: 0; }
.output-area ul, .output-area ol { margin: 0 0 12px 24px; padding-left: 16px; }
.output-area a { color: var(--paper-accent) !important; }
.output-area table { border-collapse: collapse; margin: 16px 0; white-space: normal; }
.output-area th, .output-area td { border: 1px solid var(--paper-line); padding: 4px 8px; text-align: left; vertical-align: top; }
.output-area code { font-family: var(--mono); font-size: 0.9em; }

.empty-state {
  height: 100%; min-height: 320px; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 16px; text-align: center; white-space: normal;
}
.empty-formula { color: var(--paper-ink-2) !important; opacity: 0.55; font-size: 18px; }
.empty-formula .katex { color: inherit; }
.empty-caption { font-size: 14px; color: var(--paper-ink-2) !important; }

/* ---------- divider ---------- */
.divider {
  width: 9px; margin: 0 -4px; flex-shrink: 0; position: relative; z-index: 10; cursor: col-resize; background: transparent;
}
.divider::after {
  content: ""; position: absolute; top: 0; bottom: 0; left: 4px; width: 1px; background: var(--line-hi);
  transition: background-color var(--fast) var(--ease);
}
.divider:hover::after, .divider.dragging::after { background: var(--accent); }

/* ---------- status bar ---------- */
.statusbar {
  height: 28px; flex-shrink: 0; display: flex; align-items: center; gap: 16px;
  padding: 0 24px; background: var(--surface); border-top: 1px solid var(--line);
}
.status-item { font-family: var(--mono); font-size: 11px; color: var(--text-3); display: flex; align-items: center; gap: 8px; font-variant-numeric: tabular-nums; }
.status-item.end { margin-left: auto; }

/* ---------- toast ---------- */
.toast {
  position: fixed; bottom: 48px; left: 50%; transform: translate(-50%, 8px); z-index: 1000;
  height: 36px; padding: 0 16px; display: flex; align-items: center; gap: 8px;
  background: var(--raised); color: var(--text); border: 1px solid var(--line-hi); border-radius: 8px;
  font-size: 13px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
  opacity: 0; pointer-events: none;
  transition: opacity var(--slow) var(--ease), transform var(--slow) var(--ease);
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast .state-dot { flex-shrink: 0; }

/* ---------- small screens ---------- */
@media (max-width: 720px) {
  .topbar { padding: 0 8px 0 16px; }
  .btn .label-long { display: none; }
  .workspace { flex-direction: column; }
  .pane { flex: 1 1 50% !important; width: auto !important; }
  .pane + .divider { display: none; }
  #paneRight { border-top: 1px solid var(--line); }
  .pane-header { padding: 0 16px; }
  .input-area { padding: 16px; }
  .preview { padding: 16px; }
  .output-area { padding: 32px 24px; }
  .statusbar { padding: 0 16px; }
  .pane-meta { display: none; }
}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">LaTeX Viewer</div>
  <div class="topbar-spacer"></div>
  <button class="btn" onclick="clearAll()">Vymazať</button>
  <button class="btn primary" onclick="copyForWord()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
    <span>Kopírovať<span class="label-long"> pre Word</span></span>
  </button>
</div>

<div class="workspace" id="workspace">
  <div class="pane" id="paneLeft">
    <div class="pane-header">
      <span class="state-dot" id="inputIndicator" data-state="empty"></span>
      <span class="pane-label">Vstup</span>
      <span class="pane-meta"><kbd>Ctrl</kbd><kbd>V</kbd></span>
    </div>
    <div class="input-area" id="inputArea" contenteditable="true" spellcheck="false" data-placeholder="Vlož text z ChatGPT, Gemini alebo Clauda"></div>
  </div>

  <div class="divider" id="divider" role="separator" aria-orientation="vertical" tabindex="0"></div>

  <div class="pane" id="paneRight">
    <div class="pane-header">
      <span class="pane-label">Náhľad</span>
    </div>
    <div class="preview">
      <div class="output-area" id="outputArea"></div>
    </div>
  </div>
</div>

<div class="statusbar">
  <div class="status-item" id="statusState"><span class="state-dot" data-state="empty"></span><span>Prázdne</span></div>
  <div class="status-item end" id="statusCount"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"><span class="state-dot"></span><span class="toast-text"></span></div>

<script>
// PWA Registrácia Service Workera
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then(reg => {
      console.log('ServiceWorker zaregistrovaný', reg);
    }).catch(err => {
      console.error('Chyba ServiceWorkera', err);
    });
  });
}

let renderTimeout = null;
const inputArea = document.getElementById('inputArea');
const outputArea = document.getElementById('outputArea');
const inputIndicator = document.getElementById('inputIndicator');
const statusState = document.getElementById('statusState');
const statusCount = document.getElementById('statusCount');

const STATE_LABELS = { empty: 'Prázdne', pending: 'Vykresľujem', ok: 'Vykreslené', error: 'Chyba vo vzorci' };

function setState(state, label) {
  inputIndicator.dataset.state = state;
  statusState.querySelector('.state-dot').dataset.state = state;
  statusState.querySelector('span:last-child').textContent = label || STATE_LABELS[state];
}

function plural(n, one, few, many) {
  if (n === 1) return one;
  if (n >= 2 && n <= 4) return few;
  return many;
}

function showEmpty() {
  outputArea.innerHTML = '<div class="empty-state"><div class="empty-formula" id="emptyFormula"></div><div class="empty-caption">Tu sa zobrazí text s vykreslenými vzorcami</div></div>';
  try {
    katex.render('\\int_0^1 x^2\\,dx = \\frac{1}{3}', document.getElementById('emptyFormula'), { displayMode: true, throwOnError: false });
  } catch (e) {}
  statusCount.textContent = '';
}

inputArea.addEventListener('input', () => {
  clearTimeout(renderTimeout);
  setState('pending');
  renderTimeout = setTimeout(render, 300);
});

function render() {
  const rawHTML = inputArea.innerHTML;
  if (!inputArea.innerText.trim()) {
    showEmpty();
    setState('empty');
    return;
  }

  outputArea.innerHTML = rawHTML;
  try {
    renderMathInElement(outputArea, {
      delimiters: [
        { left: '$$', right: '$$', display: true },
        { left: '\\[', right: '\\]', display: true },
        { left: '$', right: '$', display: false },
        { left: '\\(', right: '\\)', display: false }
      ],
      throwOnError: false, trust: true, output: 'htmlAndMathml'
    });
    const total = outputArea.querySelectorAll('.katex').length;
    const errors = outputArea.querySelectorAll('.katex-error').length;
    statusCount.textContent = total + ' ' + plural(total, 'vzorec', 'vzorce', 'vzorcov');
    if (errors) setState('error', errors + ' ' + plural(errors, 'chyba', 'chyby', 'chýb') + ' vo vzorcoch');
    else setState('ok');
  } catch(e) {
    setState('error');
  }
}

async function copyForWord() {
  const content = outputArea.innerHTML;
  if (!content || content.includes('empty-state')) return showToast('Nie je čo kopírovať', 'empty');

  const clone = outputArea.cloneNode(true);

  // OPRAVA 1: Extrahovanie čistého MathML pre Word
  clone.querySelectorAll('.katex').forEach(katexContainer => {
    const mathmlNode = katexContainer.querySelector('.katex-mathml math');
    if (mathmlNode) {
      // Odstránime celý KaTeX balast a nahradíme ho čistým <math> tagom.
      // Word tak presne vie, že ide o rovnicu a natívne ju prevedie.
      katexContainer.replaceWith(mathmlNode);
    }
  });

  const cleanHtml = clone.innerHTML;
  // OPRAVA 2: Pridanie MathML menného priestoru (xmlns:m) do hlavičky, aby to Word určite pochopil
  const wordReadyHtml = `
    <html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns:m="http://schemas.openxmlformats.org/officeDocument/2006/math">
    <head>
      <meta charset="utf-8">
      <style>
        body { font-family: 'Calibri', 'DM Sans', sans-serif; font-size: 11pt; color: #000000; background: #ffffff; }
        h1, h2, h3 { color: #000000; }
        table { border-collapse: collapse; width: 100%; margin-bottom: 12pt; }
        th, td { border: 1pt solid #000000; padding: 4pt 8pt; text-align: left; vertical-align: top; }
        th { background-color: #f2f2f2; font-weight: bold; }
      </style>
    </head>
    <body>${cleanHtml}</body>
    </html>
  `;

  try {
    const blobHtml = new Blob([wordReadyHtml], { type: 'text/html' });
    // OPRAVA 3: innerText ťaháme z reálneho outputArea, nie z odpojeného clone elementu
    const blobText = new Blob([outputArea.innerText], { type: 'text/plain' });

    const clipboardItem = new ClipboardItem({ 'text/html': blobHtml, 'text/plain': blobText });
    await navigator.clipboard.write([clipboardItem]);
    showToast('Skopírované, vlož do Wordu cez Ctrl+V', 'ok');
  } catch (err) {
    showToast('Kopírovanie zlyhalo', 'error');
    console.error('Clipboard error:', err);
  }
}

let toastTimeout = null;
function showToast(msg, state) {
  const t = document.getElementById('toast');
  t.querySelector('.toast-text').textContent = msg;
  t.querySelector('.state-dot').dataset.state = state || 'empty';
  t.classList.add('show');
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => t.classList.remove('show'), 3000);
}
function clearAll() { inputArea.innerHTML = ''; render(); inputArea.focus(); }

const divider = document.getElementById('divider');
const paneLeft = document.getElementById('paneLeft');
const workspace = document.getElementById('workspace');
let dragging = false;

function setLeftWidth(px) {
  const rect = workspace.getBoundingClientRect();
  const left = Math.max(200, Math.min(px, rect.width - 200));
  paneLeft.style.flex = 'none'; paneLeft.style.width = left + 'px';
}

divider.addEventListener('mousedown', () => { dragging = true; divider.classList.add('dragging'); document.body.style.cursor = 'col-resize'; });
document.addEventListener('mousemove', e => {
  if (!dragging) return;
  setLeftWidth(e.clientX - workspace.getBoundingClientRect().left);
});
document.addEventListener('mouseup', () => { dragging = false; divider.classList.remove('dragging'); document.body.style.cursor = ''; });
divider.addEventListener('keydown', e => {
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  e.preventDefault();
  setLeftWidth(paneLeft.getBoundingClientRect().width + (e.key === 'ArrowLeft' ? -24 : 24));
});

showEmpty();
</script>
</body>
</html>
