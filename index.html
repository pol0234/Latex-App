<!DOCTYPE html>
<html lang="sk" data-radius="sharp" data-buttons="pill">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LaTeX Viewer · vzorce z AI do Wordu</title>
<meta name="description" content="Vlož odpoveď z ChatGPT, Gemini alebo Clauda, skontroluj vykreslené vzorce a skopíruj ich do Wordu ako natívne rovnice.">

<!-- PWA META TAGY -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#161c1a">
<link rel="apple-touch-icon" href="icon-192.png">

<!-- KaTeX -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..600&family=Geist+Mono:wght@400..500&display=swap" rel="stylesheet">

<style>
/* deal: palette green-black-bone (a quiet near-black desk with a pale green pencil accent,
   so the paper page is the brightest thing on screen), type geist, radius sharp, buttons pill, mark wordmark */
:root {
  --p-bg: #161c1a; --p-surface: #1f2725; --p-ink: #e3e2da; --p-muted: #8e948d;
  --p-accent: #9fc7b8; --p-accent-ink: #161c1a;
  --p-inv-bg: #e3e2da; --p-inv-ink: #161c1a; --p-inv-muted: #555a55;

  --raised: #262f2c;
  --sunk: #121715;
  --line: rgba(227, 226, 218, 0.08);
  --line-hi: rgba(227, 226, 218, 0.15);
  --ink-2: #b9bab2;

  --ok: #9fc7b8;
  --wait: #d8bf7e;
  --err: #e39a8c;

  --paper: #f1f0ea;
  --paper-ink: #161c1a;
  --paper-muted: #6a6f6a;
  --paper-line: rgba(22, 28, 26, 0.12);
  --paper-accent: #2c6b57;

  --font-text: "Geist", system-ui, sans-serif;
  --font-mono: "Geist Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;

  --r-sm: 4px; --r-md: 6px; --r-lg: 8px; --r-pill: 999px;

  --ease: cubic-bezier(.2, .8, .2, 1);
  --m-in: 150ms; --m-out: 120ms; --m-press: 90ms; --m-panel: 200ms;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  background: var(--p-bg); color: var(--p-ink); font-family: var(--font-text);
  display: flex; flex-direction: column; height: 100dvh;
  -webkit-font-smoothing: antialiased; font-feature-settings: "ss01";
}
::selection { background: rgba(159, 199, 184, 0.3); }

/* ---------- top bar ---------- */
.topbar {
  height: 60px; flex-shrink: 0; display: flex; align-items: center; gap: 12px;
  padding: 0 20px;
}
.logo { display: flex; align-items: baseline; gap: 10px; font-size: inherit; font-weight: 400; color: var(--p-ink); }
.logo-word { font-size: 17px; font-weight: 500; letter-spacing: -0.02em; }
.logo-word b { font-weight: 500; color: var(--p-accent); }
.logo-sub { font-size: 13px; color: var(--p-muted); }
.topbar-spacer { flex: 1; }

/* buttons: pill; hover steps 1px up and 14% toward ink, press sinks and scales .985 */
.btn {
  height: 36px; padding: 0 16px; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  font-family: var(--font-text); font-size: 14px; font-weight: 500; white-space: nowrap;
  border-radius: var(--r-pill); border: 1px solid var(--line-hi); background: transparent; color: var(--p-ink);
  cursor: pointer;
  transition: background-color var(--m-out) var(--ease), border-color var(--m-out) var(--ease), color var(--m-out) var(--ease), transform var(--m-out) var(--ease);
}
.btn svg { width: 16px; height: 16px; flex-shrink: 0; }
.btn--primary { background: var(--p-accent); color: var(--p-accent-ink); border-color: var(--p-accent); }
.btn--quiet { border-color: transparent; color: var(--ink-2); }
.btn--sm { height: 32px; padding: 0 12px; font-size: 13px; }
@media (hover: hover) and (pointer: fine) {
  .btn:hover { transition-duration: var(--m-in); transform: translateY(-1px); background: rgba(227, 226, 218, 0.06); border-color: rgba(227, 226, 218, 0.28); }
  .btn--quiet:hover { border-color: transparent; color: var(--p-ink); }
  .btn--primary:hover { background: color-mix(in srgb, var(--p-accent) 86%, var(--p-ink)); border-color: color-mix(in srgb, var(--p-accent) 86%, var(--p-ink)); }
}
.btn:active { transition-duration: var(--m-press); transform: translateY(1px) scale(.985); }
:focus-visible { outline: 2px solid var(--p-accent); outline-offset: 2px; }

/* copy button: glyph swaps to a check in place */
.btn .ico-swap { position: relative; width: 16px; height: 16px; }
.btn .ico-swap svg { position: absolute; inset: 0; transition: opacity var(--m-in) var(--ease), transform var(--m-in) var(--ease); }
.btn .ico-check { opacity: 0; transform: scale(.7); }
.btn.is-done .ico-copy { opacity: 0; transform: scale(.7); }
.btn.is-done .ico-check { opacity: 1; transform: none; }

/* ---------- workspace: two panels on the desk ---------- */
.workspace {
  flex: 1; min-height: 0; display: flex; gap: 0; padding: 0 12px;
  animation: enter 420ms var(--ease) both;
}
@keyframes enter { from { opacity: 0; transform: translateY(8px); } }
.panel {
  flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column;
  background: var(--p-surface); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden;
}
.panel-head {
  height: 48px; flex-shrink: 0; display: flex; align-items: center; gap: 10px;
  padding: 0 8px 0 16px; border-bottom: 1px solid var(--line);
}
.panel-title { font-size: 14px; font-weight: 500; color: var(--p-ink); }
.panel-hint { font-family: var(--font-mono); font-size: 12px; color: var(--p-muted); }
.panel-tools { margin-left: auto; display: flex; align-items: center; gap: 4px; }

kbd {
  height: 22px; min-width: 22px; padding: 0 6px; display: inline-flex; align-items: center; justify-content: center;
  font-family: var(--font-mono); font-size: 11px; color: var(--ink-2);
  background: var(--raised); border: 1px solid var(--line-hi); border-bottom-width: 2px; border-radius: var(--r-sm);
}

/* render state dot */
.state-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--p-muted); flex-shrink: 0; transition: background-color var(--m-panel) var(--ease), box-shadow var(--m-panel) var(--ease); }
.state-dot[data-state="pending"] { background: var(--wait); }
.state-dot[data-state="ok"] { background: var(--ok); box-shadow: 0 0 0 3px rgba(159, 199, 184, 0.16); }
.state-dot[data-state="error"] { background: var(--err); box-shadow: 0 0 0 3px rgba(227, 154, 140, 0.16); }

/* ---------- input: the source ---------- */
.input-wrap { position: relative; flex: 1; min-height: 0; display: flex; background: var(--sunk); }
.input-area {
  flex: 1; overflow-y: auto; padding: 24px 24px 48px;
  font-family: var(--font-mono); font-size: 13.5px; line-height: 1.8; color: var(--ink-2);
  white-space: pre-wrap; word-break: break-word; outline: none; caret-color: var(--p-accent);
}
.input-area h1, .input-area h2, .input-area h3 { font-family: var(--font-mono); font-weight: 500; color: var(--p-ink); line-height: 1.5; }
.input-area h1 { font-size: 17px; margin: 0 0 16px; }
.input-area h2 { font-size: 15px; margin: 24px 0 8px; }
.input-area h3 { font-size: 14px; margin: 20px 0 8px; }
.input-area p { margin-bottom: 12px; }
.input-area ul, .input-area ol { margin: 0 0 12px 8px; padding-left: 16px; }
.input-area > :first-child { margin-top: 0; }
.input-area * { color: inherit !important; background-color: transparent !important; font-family: inherit !important; }

.input-empty {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 20px; padding: 24px; text-align: center; pointer-events: none;
  transition: opacity var(--m-panel) var(--ease);
}
.input-wrap.has-text .input-empty { opacity: 0; visibility: hidden; }
.input-empty-keys { display: flex; align-items: center; gap: 6px; }
.input-empty-keys kbd { height: 36px; min-width: 36px; padding: 0 12px; font-size: 14px; border-radius: var(--r-md); border-bottom-width: 3px; color: var(--p-ink); }
.input-empty-keys span { color: var(--p-muted); font-family: var(--font-mono); font-size: 13px; }
.input-empty-title { font-size: 18px; font-weight: 500; letter-spacing: -0.01em; color: var(--p-ink); }
.input-empty-text { max-width: 320px; font-size: 14px; line-height: 1.6; color: var(--ink-2); }
/* the input is focused while you paste or type: show it on the panel */
.panel { transition: border-color var(--m-in) var(--ease); }
.panel:focus-within { border-color: rgba(159, 199, 184, 0.45); }
.input-area:focus-visible { outline: none; box-shadow: inset 0 0 0 2px var(--p-accent); }
.input-empty .btn { pointer-events: auto; }

/* ---------- divider ---------- */
.divider { width: 12px; flex-shrink: 0; position: relative; cursor: col-resize; }
.divider::after {
  content: ""; position: absolute; left: 5px; top: 50%; width: 2px; height: 32px; margin-top: -16px;
  border-radius: 1px; background: var(--line-hi); transition: background-color var(--m-in) var(--ease);
}
.divider:hover::after, .divider.dragging::after { background: var(--p-accent); }

/* ---------- preview: the paper ---------- */
.preview { flex: 1; min-height: 0; overflow-y: auto; padding: 24px; background: var(--p-surface); }
.output-area {
  max-width: 760px; min-height: 100%; margin: 0 auto; padding: 64px 72px 72px;
  background: var(--paper); color: var(--paper-ink); border-radius: var(--r-sm);
  box-shadow: 0 1px 0 rgba(255, 255, 255, 0.5) inset, 0 1px 2px rgba(0, 0, 0, 0.35), 0 12px 32px -8px rgba(0, 0, 0, 0.45);
  font-family: var(--font-text); font-size: 15px; line-height: 1.75; white-space: pre-wrap;
}
/* pasted text often carries the chat's dark-theme colours; keep the page readable */
.output-area *:not(.katex *) { color: inherit !important; background-color: transparent !important; }
.output-area .katex { color: var(--paper-ink); font-size: 1.12em; }
.output-area .katex-display {
  margin: 20px -24px; padding: 16px 24px; overflow-x: auto; overflow-y: hidden; white-space: normal;
  border-top: 1px solid var(--paper-line); border-bottom: 1px solid var(--paper-line);
}
.output-area .katex-error { color: #a8402f !important; text-decoration: underline wavy rgba(168, 64, 47, 0.6); text-underline-offset: 3px; }
.output-area h1 { font-size: 26px; font-weight: 500; letter-spacing: -0.02em; line-height: 1.25; margin: 0 0 20px; }
.output-area h2 { font-size: 20px; font-weight: 500; letter-spacing: -0.015em; line-height: 1.3; margin: 36px 0 12px; }
.output-area h3 { font-size: 16px; font-weight: 600; margin: 28px 0 8px; }
.output-area p { margin-bottom: 12px; }
.output-area ul, .output-area ol { margin: 0 0 12px 8px; padding-left: 20px; }
.output-area li::marker { color: var(--paper-muted); }
.output-area a { color: var(--paper-accent) !important; }
.output-area table { border-collapse: collapse; margin: 16px 0; white-space: normal; font-variant-numeric: tabular-nums; }
.output-area th, .output-area td { border: 1px solid var(--paper-line); padding: 6px 10px; text-align: left; vertical-align: top; }
.output-area th { font-weight: 500; }
.output-area code { font-family: var(--font-mono); font-size: 0.88em; }
.output-area > :first-child { margin-top: 0; }

.empty-state {
  height: 100%; min-height: 360px; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 12px; text-align: center; white-space: normal;
}
.empty-formula { color: var(--paper-muted) !important; opacity: .6; font-size: 20px; }
.empty-formula .katex { color: inherit; }
.empty-caption { font-size: 14px; color: var(--paper-muted) !important; }

/* ---------- status bar ---------- */
.statusbar {
  height: 40px; flex-shrink: 0; display: flex; align-items: center; gap: 20px; padding: 0 24px;
  font-family: var(--font-mono); font-size: 12px; color: var(--p-muted); font-variant-numeric: tabular-nums;
}
.status-item { display: flex; align-items: center; gap: 8px; }
.status-item.end { margin-left: auto; }
.status-sep { width: 1px; height: 12px; background: var(--line-hi); }

/* ---------- toast ---------- */
.toast {
  position: fixed; bottom: 56px; left: 50%; transform: translate(-50%, 6px); z-index: 1000;
  height: 40px; padding: 0 16px 0 14px; display: flex; align-items: center; gap: 10px;
  background: var(--p-inv-bg); color: var(--p-inv-ink); border-radius: var(--r-pill);
  font-size: 14px; font-weight: 500; box-shadow: 0 12px 32px -8px rgba(0, 0, 0, 0.5);
  opacity: 0; pointer-events: none;
  transition: opacity var(--m-panel) var(--ease), transform var(--m-panel) var(--ease);
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast .state-dot { box-shadow: none; }
.toast .state-dot[data-state="ok"] { background: var(--paper-accent); }
.toast .state-dot[data-state="error"] { background: #a8402f; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition-property: opacity, color, background-color, border-color !important; }
  .btn:active { transform: none; }
}

/* ---------- small screens ---------- */
@media (max-width: 760px) {
  .topbar { height: 56px; padding: 0 12px 0 16px; }
  .logo-sub, .label-long, .panel-hint { display: none; }
  .btn { height: 44px; }
  .btn--sm { height: 36px; }
  .workspace { flex-direction: column; padding: 0 8px; }
  .panel { flex: 1 1 50% !important; width: auto !important; }
  .divider { width: auto; height: 8px; cursor: default; }
  .divider::after { display: none; }
  .input-area { padding: 16px; }
  .preview { padding: 12px; }
  .output-area { padding: 32px 24px; }
  .output-area .katex-display { margin: 16px -12px; padding: 12px; }
  .statusbar { padding: 0 16px; height: 36px; }
  .input-empty { gap: 12px; }
  .input-empty-text { display: none; }
}
@media (max-width: 400px) {
  .topbar { gap: 4px; }
  .logo-word { font-size: 16px; }
  .label-clear { display: none; }
  .btn--quiet { width: 44px; padding: 0; }
}
</style>
</head>
<body>

<header class="topbar">
  <h1 class="logo"><span class="logo-word">LaTeX<b>·</b>Viewer</span><span class="logo-sub">vzorce z AI do Wordu</span></h1>
  <div class="topbar-spacer"></div>
  <button class="btn btn--quiet" onclick="clearAll()" aria-label="Vymazať">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
    <span class="label-clear">Vymazať</span>
  </button>
  <button class="btn btn--primary" id="copyBtn" onclick="copyForWord()">
    <span class="ico-swap" aria-hidden="true">
      <svg class="ico-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
      <svg class="ico-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
    </span>
    <span>Kopírovať<span class="label-long"> pre Word</span></span>
  </button>
</header>

<main class="workspace" id="workspace">
  <section class="panel" id="paneLeft" aria-label="Vstup">
    <div class="panel-head">
      <span class="state-dot" id="inputIndicator" data-state="empty"></span>
      <span class="panel-title">Vstup</span>
      <span class="panel-hint">markdown + LaTeX</span>
    </div>
    <div class="input-wrap" id="inputWrap">
      <div class="input-area" id="inputArea" contenteditable="true" spellcheck="false" role="textbox" aria-multiline="true" aria-label="Vstupný text"></div>
      <div class="input-empty">
        <div class="input-empty-keys"><kbd>Ctrl</kbd><span>+</span><kbd>V</kbd></div>
        <div class="input-empty-title">Vlož odpoveď z AI</div>
        <p class="input-empty-text">Skopíruj text z ChatGPT, Gemini alebo Clauda aj so vzorcami. Vpravo uvidíš vykreslené vzorce a jedným klikom ich skopíruješ do Wordu.</p>
        <button class="btn btn--sm" onclick="loadSample()">Skúsiť ukážku</button>
      </div>
    </div>
  </section>

  <div class="divider" id="divider" role="separator" aria-orientation="vertical" aria-label="Zmeniť šírku panelov" tabindex="0"></div>

  <section class="panel" id="paneRight" aria-label="Náhľad">
    <div class="panel-head">
      <span class="panel-title">Náhľad</span>
      <span class="panel-hint">vykreslené vzorce</span>
    </div>
    <div class="preview">
      <div class="output-area" id="outputArea"></div>
    </div>
  </section>
</main>

<footer class="statusbar">
  <div class="status-item" id="statusState"><span class="state-dot" data-state="empty"></span><span>Prázdne</span></div>
  <span class="status-sep"></span>
  <div class="status-item" id="statusCount">0 vzorcov</div>
  <div class="status-item end">KaTeX → MathML</div>
</footer>
<div class="toast" id="toast" role="status" aria-live="polite"><span class="state-dot"></span><span class="toast-text"></span></div>

<script>
// PWA Registrácia Service Workera
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then(reg => {
      console.log('ServiceWorker zaregistrovaný', reg);
    }).catch(err => {
      console.error('Chyba ServiceWorkera', err);
    });
  });
}

let renderTimeout = null;
const inputArea = document.getElementById('inputArea');
const inputWrap = document.getElementById('inputWrap');
const outputArea = document.getElementById('outputArea');
const inputIndicator = document.getElementById('inputIndicator');
const statusState = document.getElementById('statusState');
const statusCount = document.getElementById('statusCount');
const copyBtn = document.getElementById('copyBtn');

const STATE_LABELS = { empty: 'Prázdne', pending: 'Vykresľujem', ok: 'Vykreslené', error: 'Chyba vo vzorci' };

const SAMPLE = '<h2>Kvadratická rovnica</h2><p>Riešenie rovnice $ax^2 + bx + c = 0$ dostaneme zo vzorca</p><p>$$x_{1,2} = \\frac{-b \\pm \\sqrt{b^2 - 4ac}}{2a}$$</p><p>Diskriminant $D = b^2 - 4ac$ určuje počet koreňov:</p><ul><li>ak $D &gt; 0$, rovnica má dva reálne korene,</li><li>ak $D = 0$, má jeden dvojnásobný koreň,</li><li>ak $D &lt; 0$, nemá reálne korene.</li></ul><h2>Príklad</h2><p>Pre $x^2 - 5x + 6 = 0$ je $D = 25 - 24 = 1$, takže</p><p>$$x_1 = 3, \\quad x_2 = 2$$</p>';

function setState(state, label) {
  inputIndicator.dataset.state = state;
  statusState.querySelector('.state-dot').dataset.state = state;
  statusState.querySelector('span:last-child').textContent = label || STATE_LABELS[state];
}

function plural(n, one, few, many) {
  if (n === 1) return one;
  if (n >= 2 && n <= 4) return few;
  return many;
}

function syncEmpty() {
  inputWrap.classList.toggle('has-text', !!inputArea.innerText.trim());
}

function showEmpty() {
  outputArea.innerHTML = '<div class="empty-state"><div class="empty-formula" id="emptyFormula"></div><div class="empty-caption">Tu sa zobrazí text s vykreslenými vzorcami</div></div>';
  try {
    katex.render('\\int_0^1 x^2\\,dx = \\frac{1}{3}', document.getElementById('emptyFormula'), { displayMode: true, throwOnError: false });
  } catch (e) {}
  statusCount.textContent = '0 vzorcov';
}

inputArea.addEventListener('input', () => {
  syncEmpty();
  clearTimeout(renderTimeout);
  setState('pending');
  renderTimeout = setTimeout(render, 300);
});

function render() {
  syncEmpty();
  const rawHTML = inputArea.innerHTML;
  if (!inputArea.innerText.trim()) {
    showEmpty();
    setState('empty');
    return;
  }

  outputArea.innerHTML = rawHTML;
  let failed = 0;
  try {
    renderMathInElement(outputArea, {
      // auto-render nechá nevykreslený vzorec ako text a ohlási ho sem
      errorCallback: (msg, err) => { failed++; console.warn(msg, err); },
      delimiters: [
        { left: '$$', right: '$$', display: true },
        { left: '\\[', right: '\\]', display: true },
        { left: '$', right: '$', display: false },
        { left: '\\(', right: '\\)', display: false }
      ],
      throwOnError: false, errorColor: '#cc0000', trust: true, output: 'htmlAndMathml'
    });
    const total = outputArea.querySelectorAll('.katex').length;
    // neznámy príkaz (napr. \sqrtt) KaTeX nevyhodí, len ho vypíše červenou (errorColor)
    const unknown = [...outputArea.querySelectorAll('.katex')].filter(k => k.querySelector('.katex-mathml mstyle[mathcolor="#cc0000"]')).length;
    const errors = failed + unknown + outputArea.querySelectorAll('.katex-error').length;
    statusCount.textContent = total + ' ' + plural(total, 'vzorec', 'vzorce', 'vzorcov');
    if (errors) setState('error', errors + ' ' + plural(errors, 'chyba', 'chyby', 'chýb') + ' vo vzorcoch');
    else setState('ok');
  } catch(e) {
    setState('error');
  }
}

function loadSample() {
  inputArea.innerHTML = SAMPLE;
  render();
  inputArea.focus();
}

async function copyForWord() {
  const content = outputArea.innerHTML;
  if (!content || content.includes('empty-state')) return showToast('Nie je čo kopírovať', 'empty');

  const clone = outputArea.cloneNode(true);

  // OPRAVA 1: Extrahovanie čistého MathML pre Word
  clone.querySelectorAll('.katex').forEach(katexContainer => {
    const mathmlNode = katexContainer.querySelector('.katex-mathml math');
    if (mathmlNode) {
      // Odstránime celý KaTeX balast a nahradíme ho čistým <math> tagom.
      // Word tak presne vie, že ide o rovnicu a natívne ju prevedie.
      katexContainer.replaceWith(mathmlNode);
    }
  });

  const cleanHtml = clone.innerHTML;
  // OPRAVA 2: Pridanie MathML menného priestoru (xmlns:m) do hlavičky, aby to Word určite pochopil
  const wordReadyHtml = `
    <html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns:m="http://schemas.openxmlformats.org/officeDocument/2006/math">
    <head>
      <meta charset="utf-8">
      <style>
        body { font-family: 'Calibri', 'DM Sans', sans-serif; font-size: 11pt; color: #000000; background: #ffffff; }
        h1, h2, h3 { color: #000000; }
        table { border-collapse: collapse; width: 100%; margin-bottom: 12pt; }
        th, td { border: 1pt solid #000000; padding: 4pt 8pt; text-align: left; vertical-align: top; }
        th { background-color: #f2f2f2; font-weight: bold; }
      </style>
    </head>
    <body>${cleanHtml}</body>
    </html>
  `;

  try {
    const blobHtml = new Blob([wordReadyHtml], { type: 'text/html' });
    // OPRAVA 3: innerText ťaháme z reálneho outputArea, nie z odpojeného clone elementu
    const blobText = new Blob([outputArea.innerText], { type: 'text/plain' });

    const clipboardItem = new ClipboardItem({ 'text/html': blobHtml, 'text/plain': blobText });
    await navigator.clipboard.write([clipboardItem]);
    showToast('Skopírované, vlož do Wordu cez Ctrl+V', 'ok');
    copyBtn.classList.add('is-done');
    setTimeout(() => copyBtn.classList.remove('is-done'), 1800);
  } catch (err) {
    showToast('Kopírovanie zlyhalo', 'error');
    console.error('Clipboard error:', err);
  }
}

let toastTimeout = null;
function showToast(msg, state) {
  const t = document.getElementById('toast');
  t.querySelector('.toast-text').textContent = msg;
  t.querySelector('.state-dot').dataset.state = state || 'empty';
  t.classList.add('show');
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => t.classList.remove('show'), 3000);
}
function clearAll() { inputArea.innerHTML = ''; render(); inputArea.focus(); }

const divider = document.getElementById('divider');
const paneLeft = document.getElementById('paneLeft');
const workspace = document.getElementById('workspace');
let dragging = false;

function setLeftWidth(px) {
  const rect = workspace.getBoundingClientRect();
  const left = Math.max(280, Math.min(px, rect.width - 320));
  paneLeft.style.flex = 'none'; paneLeft.style.width = left + 'px';
}

divider.addEventListener('mousedown', () => { dragging = true; divider.classList.add('dragging'); document.body.style.cursor = 'col-resize'; });
document.addEventListener('mousemove', e => {
  if (!dragging) return;
  // 12px okraj pracovnej plochy + polovica 12px deliča
  setLeftWidth(e.clientX - workspace.getBoundingClientRect().left - 18);
});
document.addEventListener('mouseup', () => { dragging = false; divider.classList.remove('dragging'); document.body.style.cursor = ''; });
divider.addEventListener('keydown', e => {
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  e.preventDefault();
  setLeftWidth(paneLeft.getBoundingClientRect().width + (e.key === 'ArrowLeft' ? -24 : 24));
});

showEmpty();
